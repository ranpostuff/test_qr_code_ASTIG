<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student QR Generator</title>

  <!-- Primary QR library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

  <!-- ZIP library -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

  <h2>Student QR Generator</h2>

  <p>
    Copy any columns from Google Sheets, click inside the box, then press Ctrl+V.
  </p>

  <p>
    The system detects an exact 12-digit LRN in each row and keeps it paired
    with the student name from that same row. Other information is ignored.
  </p>

  <textarea
    id="pasteBox"
    rows="14"
    cols="120"
    placeholder="Paste Google Sheets data here"
  ></textarea>

  <br><br>

  <button id="analyzeBtn">Detect Students and LRNs</button>
  <button id="exportBtn">Export PNG / ZIP</button>

  <p id="status"></p>

  <h3>Detected Students</h3>

  <table border="1" cellpadding="4" cellspacing="0">
    <thead>
      <tr>
        <th>STUDENT NAME</th>
        <th>LRN</th>
        <th>STATUS</th>
      </tr>
    </thead>
    <tbody id="detectedBody"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
